<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KAIROS — Discipline Cockpit</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app">

  <!-- ===================== TOPBAR ===================== -->
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="13.5" stroke="#38e1c6" stroke-width="1.6"/>
        <circle cx="16" cy="16" r="8" stroke="#22b8cf" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="16" cy="16" r="2.6" fill="#38e1c6"/>
        <line x1="16" y1="0.5" x2="16" y2="6" stroke="#38e1c6" stroke-width="1.6"/>
        <line x1="16" y1="26" x2="16" y2="31.5" stroke="#38e1c6" stroke-width="1.6"/>
        <line x1="0.5" y1="16" x2="6" y2="16" stroke="#38e1c6" stroke-width="1.6"/>
        <line x1="26" y1="16" x2="31.5" y2="16" stroke="#38e1c6" stroke-width="1.6"/>
      </svg>
      <span class="name">KAIROS</span>
      <span class="tag">DISCIPLINE COCKPIT</span>
    </div>
    <div class="clockbox">
      <span class="time" id="clockTime">--:--:--</span>
      <span class="date" id="clockDate">—</span>
    </div>
    <div class="phasebox"><span class="dot"></span><span id="sessionPhase">—</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="btnPlan" title="Rappel du plan de trading" aria-label="Rappel du plan de trading">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="Paramètres" aria-label="Paramètres">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="btnLogout" title="Déconnexion" aria-label="Déconnexion">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <!-- ===================== SIDEBAR ===================== -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- ===================== MAIN ===================== -->
  <main class="main" id="main">
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-journal"></section>
    <section class="view" id="view-scoring"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-profile"></section>
    <section class="view" id="view-coach"></section>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/persistence.js"></script>
<script src="js/kairos-engine.js"></script>
</body>
</html>
