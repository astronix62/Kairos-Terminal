<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — KAIROS</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body.login-body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-card{background:var(--card,#12161d);border:1px solid var(--line,#232a36);border-radius:14px;padding:36px 32px;width:100%;max-width:380px}
  .login-brand{display:flex;align-items:center;gap:8px;justify-content:center}
  .login-brand .name{font-weight:700;letter-spacing:2px;font-size:15px}
  .login-sub{text-align:center;color:var(--muted,#6b7686);font-size:12.5px;margin:6px 0 26px}
  .login-form{display:flex;flex-direction:column;gap:14px}
  .login-field label{display:block;font-size:11.5px;color:var(--muted,#6b7686);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .login-field input{width:100%;background:#0d1117;border:1px solid var(--line,#232a36);color:#e8ecf1;padding:10px 12px;border-radius:8px;font-size:13.5px}
  .login-field input:focus{outline:none;border-color:#38e1c6}
  .login-error{color:#e05a5a;font-size:12.5px;min-height:16px}
  .login-footnote{text-align:center;color:var(--muted,#6b7686);font-size:11.5px;margin-top:18px}
</style>
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-brand">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="13.5" stroke="#38e1c6" stroke-width="1.6"/>
      <circle cx="16" cy="16" r="2.6" fill="#38e1c6"/>
    </svg>
    <span class="name">KAIROS</span>
  </div>
  <p class="login-sub">Discipline Cockpit — accès personnel</p>

  <form id="login-form" class="login-form">
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="login-field">
      <label>Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <p id="login-error" class="login-error"></p>
    <button type="submit" class="btn primary" style="width:100%;padding:11px;border-radius:8px;font-size:13.5px">Se connecter</button>
  </form>

  <p class="login-footnote">Mesurer le trader, pas le marché.</p>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
